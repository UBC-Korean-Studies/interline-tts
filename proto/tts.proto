syntax = "proto3";

package interline.tts.v1;

service Tts {
  rpc Synthesize(SynthesizeRequest) returns (stream AudioChunk);

  rpc GetStatus(StatusRequest) returns (StatusReply);
}

message SynthesizeRequest {
  string text = 1;
  string lang = 2;
  string voice = 3;
  float speed = 4;
  int32 total_steps = 5;
}

message AudioChunk {
  uint32 index = 1;
  uint32 total = 2;
  string text = 3;
  bytes audio = 4;
  float duration = 5;
  string mime_type = 6;
}

message StatusRequest {}

message StatusReply {
  uint32 workers = 1;
  uint32 queued = 2;
  uint32 active = 3;
}
